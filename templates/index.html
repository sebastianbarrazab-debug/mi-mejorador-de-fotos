<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iLoveFotos - Herramientas de Imagen y PDF Online Gratis</title>
    
    <!-- LIBRERÍAS EXTERNAS -->
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    
    <!-- Cropper.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; text-align: center; background: #0b0f19; color: #f1f5f9; padding: 0; margin: 0; }
        .navbar { background: #111827; padding: 15px 30px; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid #1f2937; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 22px; font-weight: bold; color: #3b82f6; text-decoration: none; margin-right: auto; }
        .logo span { color: #f1f5f9; }
        .nav-links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .nav-links button { background: transparent; color: #9ca3af; border: none; font-size: 14px; cursor: pointer; padding: 8px 14px; border-radius: 6px; font-weight: 500; transition: 0.2s; }
        .nav-links button.active, .nav-links button:hover { color: #3b82f6; background: #1e293b; }
        
        .container { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .tab-content { display: none; width: 100%; max-width: 550px; }
        .tab-content.active { display: block; }
        
        .card { background: #111827; padding: 40px 30px; border-radius: 16px; border: 1px solid #1f2937; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; margin-bottom: 20px; }
        h2 { margin-top: 0; color: #f8fafc; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        
        input[type="file"] { display: none; }
        .file-label { display: block; background: #1e293b; border: 2px dashed #3b82f6; padding: 30px 20px; border-radius: 10px; cursor: pointer; transition: 0.2s; color: #3b82f6; font-weight: 600; margin-bottom: 20px; word-break: break-all; }
        .file-label:hover { background: #1e293b; border-color: #60a5fa; color: #60a5fa; }
        
        .selector-formato { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; background: #1e293b; color: white; border: 1px solid #374151; font-size: 15px; cursor: pointer; }
        
        .btn-action { background: #2563eb; color: white; padding: 14px 28px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; box-shadow: 0 4px 6px -1px rgba(37,99,235,0.4); margin-bottom: 10px; }
        .btn-action:hover { background: #1d4ed8; }
        
        .ads-section { display: none; width: 100%; max-width: 550px; padding: 20px; background: #1e293b; border-radius: 12px; border: 1px solid #374151; box-sizing: border-box; }
        .status-text { color: #34d399; font-weight: 600; margin-bottom: 10px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">iLove<span>Fotos</span></a>
        <div class="nav-links">
            <button id="nav-borrador" class="active" onclick="switchTab('borrador')">🪄 Borrador Inteligente</button>
            <button id="nav-pdf" onclick="switchTab('pdf')">📑 PDF</button>
            <button id="nav-comprimir" onclick="switchTab('comprimir')">🗜️ Comprimir</button>
            <button id="nav-convertir" onclick="switchTab('convertir')">🔄 Convertir</button>
            <button id="nav-recortar" onclick="switchTab('recortar')">✂️ Recortar</button>
        </div>
    </nav>

    <div class="container">
        
        <!-- BORRADOR INTELIGENTE -->
        <div id="tab-borrador" class="tab-content active">
            <div class="card">
                <h2>Borrador Inteligente de Fondo</h2>
                <p>Haz clic en el fondo para detectarlo y borrarlo mágicamente.</p>
                <label for="input-borrador" class="file-label" id="label-borrador">📁 Seleccionar foto</label>
                <input type="file" id="input-borrador" accept="image/*" onchange="prepararBorrador(event)">
                
                <div id="herramientas-borrador" style="display:none; margin-top: 20px;">
                    
                    <div style="display: flex; gap: 15px; margin-bottom: 15px; justify-content: center; background: #1e293b; padding: 10px; border-radius: 8px;">
                        <label style="color: white; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                            <input type="radio" name="tool-mode" value="magic" checked onchange="toggleBorradorMode()"> 🪄 Varita (Auto)
                        </label>
                        <label style="color: white; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                            <input type="radio" name="tool-mode" value="brush" onchange="toggleBorradorMode()"> 🖌️ Pincel (Manual)
                        </label>
                    </div>

                    <div id="opciones-magic">
                        <p style="margin: 5px 0; color: #94a3b8; font-size: 13px; text-align: left;">Tolerancia Mágica (Si borra mucho, bájala):</p>
                        <input type="range" id="magic-tolerance" min="0" max="150" value="40" style="width: 100%; margin-bottom: 15px;">
                    </div>

                    <div id="opciones-brush" style="display:none;">
                        <p style="margin: 5px 0; color: #94a3b8; font-size: 13px; text-align: left;">Tamaño del Pincel Manual:</p>
                        <input type="range" id="brush-size" min="5" max="100" value="30" style="width: 100%; margin-bottom: 15px;">
                    </div>
                    
                    <div style="position: relative; background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAMUlEQVQ4T2NkYGAQYcAP3uCTZhw1gGGYhAGlpSUGIg3m5eVlYGIYNYBhmIQBvYEPAwAwLwH9rS1X+QAAAABJRU5ErkJggg==') repeat; border-radius: 8px; border: 1px solid #374151; overflow: hidden; display: flex; justify-content: center; align-items: center; background-color: #fff;">
                        <canvas id="canvas-borrador" style="cursor: crosshair; max-width: 100%; touch-action: none;"></canvas>
                    </div>
                    
                    <button class="btn-action" style="margin-top: 20px;" onclick="guardarFondoBorrado()">📥 Descargar PNG sin fondo</button>
                </div>
            </div>
        </div>

        <!-- ZONA DE DESCARGA -->
        <div class="ads-section" id="seccion-anuncio">
            <div class="status-text" id="texto-estado">¡Procesamiento completo!</div>
            <button id="btn-descargar" class="btn-action">📥 Descargar Archivo</button>
        </div>

    </div>

    <script>
        let blobDescargaLocal = null;
        let extensionDescargaLocal = "png";

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-links button').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`nav-${tab}`).classList.add('active');
        }

        // --- LÓGICA DEL BORRADOR MÁGICO Y MANUAL ---
        let canvasBorrador = document.getElementById('canvas-borrador');
        let ctxBorrador = canvasBorrador.getContext('2d', { willReadFrequently: true });
        let isDrawing = false;
        let currentMode = 'magic'; // 'magic' o 'brush'

        function toggleBorradorMode() {
            currentMode = document.querySelector('input[name="tool-mode"]:checked').value;
            if (currentMode === 'magic') {
                document.getElementById('opciones-magic').style.display = 'block';
                document.getElementById('opciones-brush').style.display = 'none';
            } else {
                document.getElementById('opciones-magic').style.display = 'none';
                document.getElementById('opciones-brush').style.display = 'block';
            }
        }

        function prepararBorrador(event) {
            let file = event.target.files[0];
            if (!file) return;
            document.getElementById('label-borrador').innerText = "✅ " + file.name;

            let reader = new FileReader();
            reader.onload = function(e) {
                let img = new Image();
                img.onload = function() {
                    let maxWidth = window.innerWidth > 600 ? 500 : window.innerWidth - 80;
                    let scale = 1;
                    if (img.width > maxWidth) scale = maxWidth / img.width;
                    
                    canvasBorrador.width = img.width * scale;
                    canvasBorrador.height = img.height * scale;
                    
                    ctxBorrador.globalCompositeOperation = "source-over";
                    ctxBorrador.drawImage(img, 0, 0, canvasBorrador.width, canvasBorrador.height);
                    document.getElementById('herramientas-borrador').style.display = 'block';
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function getPointerPos(e) {
            let rect = canvasBorrador.getBoundingClientRect();
            let clientX = e.clientX || (e.touches && e.touches[0].clientX);
            let clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return {
                x: Math.floor((clientX - rect.left) * (canvasBorrador.width / rect.width)),
                y: Math.floor((clientY - rect.top) * (canvasBorrador.height / rect.height))
            };
        }

        // MANEJADOR DE CLICS (Para la Varita Mágica)
        canvasBorrador.addEventListener('click', function(e) {
            if (currentMode !== 'magic') return;
            let pos = getPointerPos(e);
            let tolerance = parseInt(document.getElementById('magic-tolerance').value);
            magicWand(pos.x, pos.y, tolerance);
        });

        // MANEJADORES DE DIBUJO (Para el Pincel Manual)
        function startDrawing(e) {
            if (currentMode !== 'brush') return;
            isDrawing = true;
            draw(e);
        }
        function stopDrawing() {
            if (currentMode !== 'brush') return;
            isDrawing = false;
            ctxBorrador.beginPath();
        }
        function draw(e) {
            if (!isDrawing || currentMode !== 'brush') return;
            e.preventDefault();
            let pos = getPointerPos(e);
            let brushSize = document.getElementById('brush-size').value;

            ctxBorrador.globalCompositeOperation = "destination-out";
            ctxBorrador.lineWidth = brushSize;
            ctxBorrador.lineCap = "round";
            
            ctxBorrador.lineTo(pos.x, pos.y);
            ctxBorrador.stroke();
            ctxBorrador.beginPath();
            ctxBorrador.moveTo(pos.x, pos.y);
        }

        canvasBorrador.addEventListener('mousedown', startDrawing);
        canvasBorrador.addEventListener('mousemove', draw);
        canvasBorrador.addEventListener('mouseup', stopDrawing);
        canvasBorrador.addEventListener('mouseleave', stopDrawing);
        canvasBorrador.addEventListener('touchstart', startDrawing, {passive: false});
        canvasBorrador.addEventListener('touchmove', draw, {passive: false});
        canvasBorrador.addEventListener('touchend', stopDrawing);

        // ALGORITMO DE VARITA MÁGICA (Flood Fill)
        function magicWand(startX, startY, tolerance) {
            let width = canvasBorrador.width;
            let height = canvasBorrador.height;
            let imgData = ctxBorrador.getImageData(0, 0, width, height);
            let data = imgData.data;
            let uint32Data = new Uint32Array(data.buffer);
            
            let startPos = startY * width + startX;
            let targetR = data[startPos * 4];
            let targetG = data[startPos * 4 + 1];
            let targetB = data[startPos * 4 + 2];
            let targetA = data[startPos * 4 + 3];

            if (targetA === 0) return; // Si ya es transparente, no hace nada

            let stack = [startPos];
            let visited = new Uint8Array(width * height);
            visited[startPos] = 1;

            while (stack.length > 0) {
                let current = stack.pop();
                let x = current % width;
                let y = Math.floor(current / width);

                uint32Data[current] = 0; // Vuelve el píxel 100% transparente

                // Revisar vecinos (arriba, abajo, izquierda, derecha)
                let neighbors = [
                    current - width, // arriba
                    current + width, // abajo
                    current - 1,     // izquierda
                    current + 1      // derecha
                ];

                for (let i = 0; i < 4; i++) {
                    let n = neighbors[i];
                    
                    // Prevenir saltos por los bordes
                    if (n < 0 || n >= width * height) continue;
                    if (i === 2 && x === 0) continue;
                    if (i === 3 && x === width - 1) continue;

                    if (!visited[n]) {
                        let r = data[n * 4];
                        let g = data[n * 4 + 1];
                        let b = data[n * 4 + 2];
                        let a = data[n * 4 + 3];

                        // Comparar si el color es similar según la tolerancia
                        if (a > 0 && 
                            Math.abs(r - targetR) <= tolerance && 
                            Math.abs(g - targetG) <= tolerance && 
                            Math.abs(b - targetB) <= tolerance) {
                            
                            visited[n] = 1;
                            stack.push(n);
                        }
                    }
                }
            }
            // Restaurar modo normal y aplicar los cambios
            ctxBorrador.globalCompositeOperation = "source-over";
            ctxBorrador.putImageData(imgData, 0, 0);
        }

        // DESCARGA
        function guardarFondoBorrado() {
            canvasBorrador.toBlob((blob) => {
                let url = URL.createObjectURL(blob);
                let a = document.createElement('a');
                a.href = url;
                a.download = `ilovefotos_sinfondo.png`;
                a.click();
            }, 'image/png');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suite de Herramientas: Texto e Imagen</title>
    
    <!-- Librería Cropper.js para la herramienta de Recortar Imagen -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        /* Diseño oscuro, moderno y profesional */
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #cccccc;
            --border-color: #3e3e42;
            --accent-blue: #0e639c;
            --accent-hover: #1177bb;
            --error-red: #f14c4c;
            --warn-yellow: #cca700;
            --success-green: #89d185;
            --toolbar-bg: #2d2d30;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Sistema de Pestañas (Tabs) */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
            gap: 10px;
        }

        .tab-btn {
            background: none;
            color: #858585;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            font-weight: 500;
        }

        .tab-btn:hover { color: white; }
        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--accent-blue);
            font-weight: bold;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Barras de Herramientas */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            background-color: var(--toolbar-bg);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .tool-btn {
            background-color: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
            font-weight: 500;
        }

        .tool-btn:hover { background-color: #505050; }
        
        .btn-primary {
            background-color: var(--accent-blue);
            color: white;
            border: none;
        }
        .btn-primary:hover { background-color: var(--accent-hover); }

        /* ================= ESTILOS SECCIÓN TEXTO ================= */
        textarea {
            width: 100%;
            height: 200px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus { border-color: var(--accent-blue); }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
            color: #858585;
        }

        .main-action {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .btn-analizar {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s;
            width: 100%;
            max-width: 400px;
        }

        .btn-analizar:disabled { background-color: #555; cursor: not-allowed; }

        .error-card {
            background-color: #2d2d30;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .grammar-err { border-left-color: var(--warn-yellow); }
        .punct-err { border-left-color: var(--accent-blue); }
        .spell-err { border-left-color: var(--error-red); }

        .suggestion-btn {
            background-color: #059669;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            margin: 6px 6px 0 0;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }
        .suggestion-btn:hover { background-color: #047857; }

        #contenedor-errores { display: none; margin-top: 20px; }

        /* ================= ESTILOS SECCIÓN IMAGEN ================= */
        .image-workspace {
            width: 100%;
            height: 450px;
            background-color: #1e1e1e;
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-top: 15px;
            position: relative;
        }

        .image-workspace img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .placeholder-text {
            color: #555;
            font-size: 18px;
            position: absolute;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- NAVEGACIÓN DE PESTAÑAS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarPestaña('tab-texto', this)">📝 Herramientas de Texto</button>
            <button class="tab-btn" onclick="cambiarPestaña('tab-imagen', this)">🖼️ Herramientas de Imagen</button>
        </div>

        <!-- ========================================== -->
        <!-- PESTAÑA 1: EDITOR DE TEXTO (INTACTO)       -->
        <!-- ========================================== -->
        <div id="tab-texto" class="tab-content active">
            <div class="toolbar">
                <button class="tool-btn" onclick="copiarTexto()">📋 Copiar</button>
                <button class="tool-btn" onclick="limpiarTexto()">🗑️ Limpiar</button>
                <button class="tool-btn" onclick="convertirMayusculas()">AA Mayúsculas</button>
                <button class="tool-btn" onclick="convertirMinusculas()">aa Minúsculas</button>
                <button class="tool-btn" onclick="quitarEspacios()">🧹 Quitar espacios extra</button>
            </div>

            <textarea id="input-texto" placeholder="Escribe o pega tu texto aquí..." oninput="actualizarContadores()"></textarea>
            
            <div class="status-bar">
                <span id="contador-palabras">Palabras: 0</span>
                <span id="contador-caracteres">Caracteres: 0</span>
            </div>

            <div class="main-action">
                <button id="btn-analizar" class="btn-analizar" onclick="analizarTexto()">🔍 Analizar Ortografía y Gramática</button>
            </div>

            <div id="contenedor-errores">
                <h3 style="margin-top: 0; color: white; font-size: 16px; border-bottom: 1px solid #3e3e42; padding-bottom: 8px;">
                    Resultados del Análisis <span id="badge-errores" style="background: var(--error-red); color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-left: 10px;">0</span>
                </h3>
                <div id="lista-errores"></div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- PESTAÑA 2: EDITOR DE IMÁGENES (RESTAURADO) -->
        <!-- ========================================== -->
        <div id="tab-imagen" class="tab-content">
            <div class="toolbar">
                <input type="file" id="upload-img" accept="image/*" style="display:none;" onchange="cargarImagen(event)">
                <button class="tool-btn btn-primary" onclick="document.getElementById('upload-img').click()">📁 Subir Imagen</button>
                
                <span style="border-left: 1px solid #555; margin: 0 5px;"></span>
                
                <button class="tool-btn" onclick="iniciarRecorte()" id="btn-recortar">✂️ Activar Recorte</button>
                <button class="tool-btn" onclick="eliminarFondo()" id="btn-fondo">🪄 Eliminar Fondo Mágico</button>
                
                <span style="border-left: 1px solid #555; margin: 0 5px;"></span>

                <button class="tool-btn" onclick="descargarImagen()" style="background-color: #059669; color: white; border: none;">💾 Descargar</button>
            </div>

            <div class="image-workspace" id="workspace">
                <span class="placeholder-text" id="img-placeholder">Sube una imagen para comenzar...</span>
                <img id="img-preview" style="display: none;">
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // LÓGICA DE PESTAÑAS
        // ==========================================
        function cambiarPestaña(idTab, elementoBtn) {
            // Ocultar todos los contenidos
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            // Quitar clase active a los botones
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            // Mostrar el tab seleccionado
            document.getElementById(idTab).classList.add('active');
            elementoBtn.classList.add('active');
        }

        // ==========================================
        // LÓGICA DE TEXTO (Exactamente como pediste)
        // ==========================================
        const textarea = document.getElementById('input-texto');

        function actualizarContadores() {
            let texto = textarea.value;
            let caracteres = texto.length;
            let palabras = texto.trim() === "" ? 0 : texto.trim().split(/\s+/).length;
            document.getElementById('contador-caracteres').innerText = `Caracteres: ${caracteres}`;
            document.getElementById('contador-palabras').innerText = `Palabras: ${palabras}`;
        }

        function copiarTexto() {
            if (!textarea.value) return;
            navigator.clipboard.writeText(textarea.value).then(() => alert("¡Texto copiado!"));
        }

        function limpiarTexto() {
            if (confirm("¿Limpiar todo el texto?")) {
                textarea.value = "";
                actualizarContadores();
                document.getElementById('contenedor-errores').style.display = 'none';
            }
        }

        function convertirMayusculas() { textarea.value = textarea.value.toUpperCase(); actualizarContadores(); }
        function convertirMinusculas() { textarea.value = textarea.value.toLowerCase(); actualizarContadores(); }
        function quitarEspacios() { textarea.value = textarea.value.replace(/\s+/g, ' ').trim(); actualizarContadores(); }

        async function analizarTexto() {
            let texto = textarea.value.trim();
            if (!texto) return alert("Por favor, ingresa un texto.");

            let btn = document.getElementById('btn-analizar');
            btn.innerText = "⏳ Analizando...";
            btn.disabled = true;

            try {
                let response = await fetch('https://api.languagetool.org/v2/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 'text': texto, 'language': 'es' })
                });

                let data = await response.json();
                mostrarResultados(data.matches || [], texto);
            } catch (e) {
                alert("Error de conexión con el servidor de análisis.");
            } finally {
                btn.innerText = "🔍 Analizar Ortografía y Gramática";
                btn.disabled = false;
            }
        }

        function mostrarResultados(matches, textoOriginal) {
            document.getElementById('badge-errores').innerText = matches.length;
            let contenedorLista = document.getElementById('lista-errores');
            contenedorLista.innerHTML = '';

            if (matches.length === 0) {
                contenedorLista.innerHTML = '<div style="color: var(--success-green); padding: 15px; border: 1px solid var(--success-green); border-radius: 6px;">¡Excelente! No se detectaron errores.</div>';
            } else {
                matches.forEach((err, idx) => {
                    let textoAfectado = textoOriginal.substring(err.offset, err.offset + err.length);
                    let esGramatica = err.rule && err.rule.issueType === 'grammar';
                    let esPuntuacion = err.rule && err.rule.issueType === 'typographical';
                    
                    let tipoError = esPuntuacion ? 'Puntuación' : (esGramatica ? 'Gramática' : 'Ortografía');
                    let claseColor = esPuntuacion ? 'punct-err' : (esGramatica ? 'grammar-err' : 'spell-err');
                    let colorTexto = esPuntuacion ? 'var(--accent-blue)' : (esGramatica ? 'var(--warn-yellow)' : 'var(--error-red)');

                    let sugerenciasHTML = err.replacements.slice(0, 4).map(rep => 
                        `<button class="suggestion-btn" onclick="aplicarSugerencia(${err.offset}, ${err.length}, '${rep.value.replace(/'/g, "\\'")}')">${rep.value}</button>`
                    ).join('');

                    let card = document.createElement('div');
                    card.className = `error-card ${claseColor}`;
                    card.innerHTML = `
                        <div style="font-size: 13px; color: #858585; margin-bottom: 5px;">Detalle: <strong style="color: ${colorTexto}">${tipoError}</strong></div>
                        <div style="margin-bottom: 8px; font-size: 15px;">Problema en: <span style="text-decoration: underline; color:${colorTexto};">${textoAfectado || '(Espacio/Signo)'}</span></div>
                        <div style="font-size: 14px; margin-bottom: 12px; color: #d4d4d4;">${err.message}</div>
                        ${sugerenciasHTML ? `<div>${sugerenciasHTML}</div>` : '<div style="font-size: 12px; color: #858585;">No hay sugerencias automáticas.</div>'}
                    `;
                    contenedorLista.appendChild(card);
                });
            }
            document.getElementById('contenedor-errores').style.display = 'block';
        }

        function aplicarSugerencia(offset, length, nuevoTexto) {
            textarea.value = textarea.value.substring(0, offset) + nuevoTexto + textarea.value.substring(offset + length);
            actualizarContadores();
            analizarTexto();
        }
        actualizarContadores();


        // ==========================================
        // LÓGICA DE IMAGEN (Recorte y Fondo restaurados)
        // ==========================================
        let imgPreview = document.getElementById('img-preview');
        let placeholder = document.getElementById('img-placeholder');
        let cropper = null;
        let originalName = "imagen_editada.png";

        function cargarImagen(event) {
            let file = event.target.files[0];
            if (!file) return;
            originalName = file.name;
            
            let reader = new FileReader();
            reader.onload = function(e) {
                if (cropper) { cropper.destroy(); cropper = null; }
                imgPreview.src = e.target.result;
                imgPreview.style.display = 'block';
                placeholder.style.display = 'none';
                document.getElementById('btn-recortar').innerText = "✂️ Activar Recorte";
            }
            reader.readAsDataURL(file);
        }

        // Herramienta 1: Recortar (Usando Cropper.js)
        function iniciarRecorte() {
            if (!imgPreview.src || imgPreview.style.display === 'none') return alert("Primero sube una imagen.");
            
            let btnRecortar = document.getElementById('btn-recortar');

            if (cropper) {
                // Si ya está activo, aplicamos el recorte
                let canvas = cropper.getCroppedCanvas();
                imgPreview.src = canvas.toDataURL("image/png");
                cropper.destroy();
                cropper = null;
                btnRecortar.innerText = "✂️ Activar Recorte";
            } else {
                // Iniciar el área de recorte
                cropper = new Cropper(imgPreview, {
                    viewMode: 1,
                    autoCropArea: 0.8,
                    background: false,
                    responsive: true
                });
                btnRecortar.innerText = "✅ Aplicar Recorte";
            }
        }

        // Herramienta 2: Eliminar Fondo Mágico (Vía Canvas - Detección de color perimetral)
        function eliminarFondo() {
            if (!imgPreview.src || imgPreview.style.display === 'none') return alert("Primero sube una imagen.");
            
            // Si hay un recorte activo, aplicarlo antes de borrar el fondo
            if (cropper) iniciarRecorte(); 

            let btnFondo = document.getElementById('btn-fondo');
            btnFondo.innerText = "⏳ Procesando...";
            
            setTimeout(() => {
                let canvas = document.createElement('canvas');
                let ctx = canvas.getContext('2d');
                let img = new Image();
                img.crossOrigin = "Anonymous";
                img.src = imgPreview.src;
                
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    let data = imgData.data;
                    
                    // Tomar el color del píxel superior izquierdo como "Fondo a eliminar"
                    let r0 = data[0], g0 = data[1], b0 = data[2];
                    let tolerancia = 60; // Tolerancia de color

                    for (let i = 0; i < data.length; i += 4) {
                        let r = data[i], g = data[i+1], b = data[i+2];
                        // Calcular distancia de color (Euclidiana)
                        let distancia = Math.sqrt(Math.pow(r-r0, 2) + Math.pow(g-g0, 2) + Math.pow(b-b0, 2));
                        
                        // Si el color es similar al fondo, hacerlo transparente
                        if (distancia < tolerancia) {
                            data[i+3] = 0; // Alpha a 0 (Transparente)
                        }
                    }
                    
                    ctx.putImageData(imgData, 0, 0);
                    imgPreview.src = canvas.toDataURL('image/png');
                    btnFondo.innerText = "🪄 Eliminar Fondo Mágico";
                }
            }, 100);
        }

        // Herramienta 3: Descargar
        function descargarImagen() {
            if (!imgPreview.src || imgPreview.style.display === 'none') return alert("No hay imagen para descargar.");
            
            // Si hay un recorte a medias, lo aplica antes de descargar
            if (cropper) iniciarRecorte();

            let a = document.createElement('a');
            a.href = imgPreview.src;
            a.download = "editada_" + originalName.replace(/\.[^/.]+$/, ".png");
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>

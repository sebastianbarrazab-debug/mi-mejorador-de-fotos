<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador Ortográfico y Herramientas de Texto</title>
    <style>
        /* Diseño oscuro, moderno y profesional */
        :root {
            --bg-color: #1e1e1e;
            --panel-bg: #252526;
            --text-color: #cccccc;
            --border-color: #3e3e42;
            --accent-blue: #0e639c;
            --accent-hover: #1177bb;
            --error-red: #f14c4c;
            --warn-yellow: #cca700;
            --success-green: #89d185;
            --toolbar-bg: #2d2d30;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 0;
            color: #ffffff;
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Barra de herramientas clásica */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            background-color: var(--toolbar-bg);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .tool-btn {
            background-color: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .tool-btn:hover {
            background-color: #505050;
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-size: 15px;
            line-height: 1.5;
            resize: vertical;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: var(--accent-blue);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 13px;
            color: #858585;
        }

        .main-action {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .btn-analizar {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background-color 0.2s;
            width: 100%;
            max-width: 400px;
        }

        .btn-analizar:hover {
            background-color: var(--accent-hover);
        }

        .btn-analizar:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* Tarjetas de Errores */
        .error-card {
            background-color: #2d2d30;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 12px;
            transition: transform 0.1s;
        }

        .error-card:hover {
            background-color: #333337;
        }

        .grammar-err { border-left-color: var(--warn-yellow); }
        .punct-err { border-left-color: var(--accent-blue); }
        .spell-err { border-left-color: var(--error-red); }

        .suggestion-btn {
            background-color: #059669; /* Verde para sugerencias */
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            margin: 6px 6px 0 0;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .suggestion-btn:hover {
            background-color: #047857;
        }

        #contenedor-errores {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>
            <span>📝 Editor y Analizador de Texto</span>
        </h2>

        <!-- HERRAMIENTAS CLÁSICAS -->
        <div class="toolbar">
            <button class="tool-btn" onclick="copiarTexto()">📋 Copiar</button>
            <button class="tool-btn" onclick="limpiarTexto()">🗑️ Limpiar</button>
            <button class="tool-btn" onclick="convertirMayusculas()">AA Mayúsculas</button>
            <button class="tool-btn" onclick="convertirMinusculas()">aa Minúsculas</button>
            <button class="tool-btn" onclick="quitarEspacios()">🧹 Quitar espacios extra</button>
        </div>

        <!-- ÁREA DE TEXTO -->
        <textarea id="input-texto" placeholder="Escribe o pega tu texto aquí..." oninput="actualizarContadores()"></textarea>
        
        <!-- ESTADÍSTICAS EN TIEMPO REAL -->
        <div class="status-bar">
            <span id="contador-palabras">Palabras: 0</span>
            <span id="contador-caracteres">Caracteres: 0</span>
        </div>

        <!-- BOTÓN PRINCIPAL DE ANÁLISIS -->
        <div class="main-action">
            <button id="btn-analizar" class="btn-analizar" onclick="analizarTexto()">🔍 Analizar Ortografía y Gramática</button>
        </div>

        <!-- CONTENEDOR DE RESULTADOS INTERACTIVOS -->
        <div id="contenedor-errores">
            <h3 style="margin-top: 0; color: white; font-size: 16px; border-bottom: 1px solid #3e3e42; padding-bottom: 8px;">
                Resultados del Análisis <span id="badge-errores" style="background: var(--error-red); color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-left: 10px;">0</span>
            </h3>
            <div id="lista-errores"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // HERRAMIENTAS DE TEXTO (Las clásicas)
        // ==========================================
        const textarea = document.getElementById('input-texto');

        function actualizarContadores() {
            let texto = textarea.value;
            let caracteres = texto.length;
            let palabras = texto.trim() === "" ? 0 : texto.trim().split(/\s+/).length;
            
            document.getElementById('contador-caracteres').innerText = `Caracteres: ${caracteres}`;
            document.getElementById('contador-palabras').innerText = `Palabras: ${palabras}`;
        }

        function copiarTexto() {
            if (!textarea.value) return;
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert("¡Texto copiado al portapapeles!");
            });
        }

        function limpiarTexto() {
            if (confirm("¿Estás seguro de que deseas limpiar todo el texto?")) {
                textarea.value = "";
                actualizarContadores();
                document.getElementById('contenedor-errores').style.display = 'none';
            }
        }

        function convertirMayusculas() {
            textarea.value = textarea.value.toUpperCase();
            actualizarContadores();
        }

        function convertirMinusculas() {
            textarea.value = textarea.value.toLowerCase();
            actualizarContadores();
        }

        function quitarEspacios() {
            textarea.value = textarea.value.replace(/\s+/g, ' ').trim();
            actualizarContadores();
        }

        // ==========================================
        // MOTOR DE ANÁLISIS (Solo escaneo manual)
        // ==========================================
        async function analizarTexto() {
            let texto = textarea.value.trim();
            if (!texto) return alert("Por favor, ingresa un texto para analizar.");

            let btn = document.getElementById('btn-analizar');
            btn.innerText = "⏳ Analizando...";
            btn.disabled = true;

            try {
                // Consulta directa a la API para buscar errores
                let response = await fetch('https://api.languagetool.org/v2/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ 'text': texto, 'language': 'es' })
                });

                let data = await response.json();
                let matches = data.matches || [];
                
                mostrarResultados(matches, texto);

            } catch (e) {
                alert("Hubo un error al conectar con el servidor de análisis. Revisa tu conexión.");
            } finally {
                btn.innerText = "🔍 Analizar Ortografía y Gramática";
                btn.disabled = false;
            }
        }

        function mostrarResultados(matches, textoOriginal) {
            document.getElementById('badge-errores').innerText = matches.length;
            let contenedorLista = document.getElementById('lista-errores');
            contenedorLista.innerHTML = '';

            if (matches.length === 0) {
                contenedorLista.innerHTML = '<div style="color: var(--success-green); background: #1e2e1e; padding: 15px; border-radius: 6px; border: 1px solid var(--success-green);">¡Excelente! No se detectaron errores ortográficos ni gramaticales.</div>';
            } else {
                matches.forEach((err, idx) => {
                    let textoAfectado = textoOriginal.substring(err.offset, err.offset + err.length);
                    let esGramatica = err.rule && err.rule.issueType === 'grammar';
                    let esPuntuacion = err.rule && err.rule.issueType === 'typographical';
                    
                    let tipoError = esPuntuacion ? 'Puntuación' : (esGramatica ? 'Gramática' : 'Ortografía');
                    let claseColor = esPuntuacion ? 'punct-err' : (esGramatica ? 'grammar-err' : 'spell-err');
                    let colorTexto = esPuntuacion ? 'var(--accent-blue)' : (esGramatica ? 'var(--warn-yellow)' : 'var(--error-red)');

                    // Generar botones de sugerencia (Solo tomamos las 4 mejores para no saturar)
                    let sugerenciasHTML = err.replacements.slice(0, 4).map(rep => 
                        // Pasamos el offset, length y el valor de reemplazo escapando comillas
                        `<button class="suggestion-btn" onclick="aplicarSugerencia(${err.offset}, ${err.length}, '${rep.value.replace(/'/g, "\\'")}')">${rep.value}</button>`
                    ).join('');

                    let card = document.createElement('div');
                    card.className = `error-card ${claseColor}`;
                    card.innerHTML = `
                        <div style="font-size: 13px; color: #858585; margin-bottom: 5px;">
                            Detalle: <strong style="color: ${colorTexto}">${tipoError}</strong>
                        </div>
                        <div style="margin-bottom: 8px; font-size: 15px;">
                            Problema en: <span style="text-decoration: underline; text-decoration-color: ${colorTexto}; background-color: rgba(255,255,255,0.05); padding: 2px 4px; border-radius: 3px;">${textoAfectado || '(Falta espacio o signo)'}</span>
                        </div>
                        <div style="font-size: 14px; margin-bottom: 12px; color: #d4d4d4;">${err.message}</div>
                        ${sugerenciasHTML ? `<div style="border-top: 1px solid #3e3e42; padding-top: 10px;">${sugerenciasHTML}</div>` : '<div style="font-size: 12px; color: #858585; font-style: italic;">No hay sugerencias automáticas. Debes corregirlo manualmente.</div>'}
                    `;
                    contenedorLista.appendChild(card);
                });
            }
            document.getElementById('contenedor-errores').style.display = 'block';
        }

        // Función que se ejecuta cuando el usuario hace clic en un botón verde de sugerencia
        function aplicarSugerencia(offset, length, nuevoTexto) {
            let textoOriginal = textarea.value;
            
            // Reemplazamos exactamente en la posición indicada
            textarea.value = textoOriginal.substring(0, offset) + nuevoTexto + textoOriginal.substring(offset + length);
            
            // Actualizamos contadores
            actualizarContadores();

            // Volvemos a analizar automáticamente para que los "offsets" (posiciones) de los demás errores se recalculen
            analizarTexto();
        }

        // Inicializar contadores al cargar la página
        actualizarContadores();
    </script>
</body>
</html>
